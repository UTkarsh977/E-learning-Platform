<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LearnSphere | Sign Up</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body data-page="signup">
  <main class="auth-page">
    <section class="auth-panel">
      <a class="brand auth-brand" href="index.html"><span class="brand-mark">LS</span><span>LearnSphere</span></a>
      <p class="eyebrow">Start learning</p>
      <h1>Create your student account</h1>
      <form class="auth-form" id="signupForm">
        <label>
          <span>Full name</span>
          <input type="text" name="name" autocomplete="name" required>
        </label>
        <label>
          <span>Email</span>
          <input type="email" name="email" autocomplete="email" required>
        </label>
        <label>
          <span>Password</span>
          <input type="password" name="password" autocomplete="new-password" minlength="6" required>
        </label>
        <p class="auth-message" id="authMessage" role="status"></p>
        <button class="primary-action" type="submit">Sign up</button>
      </form>
      <p class="auth-switch">Already have an account? <a href="login.html">Login</a></p>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
